name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify lock and runtime identity
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node -e 'const lock=require("./package-lock.json").packages["node_modules/@testmuai/rook"]; const spec=require("./runtime.json").rook; if(lock.version!==spec.version||lock.integrity!==spec.npm_integrity) process.exit(1)'
          node -e 'const w=require("node:fs").readFileSync(".github/workflows/release.yml","utf8"); for(const value of ["platforms: linux/amd64,linux/arm64", "for platform in linux/amd64 linux/arm64", "docker run --rm --platform", "rook-image-linux-amd64.spdx.json", "rook-image-linux-arm64.spdx.json", "steps.image.outputs.amd64_digest", "steps.image.outputs.arm64_digest"]) if(!w.includes(value)) process.exit(1)'
      - name: Build and smoke-test image
        run: |
          set -euo pipefail
          docker build --pull=false \
            --build-arg "ROOK_VERSION=$(jq -r '.rook.version' runtime.json)" \
            --build-arg "ROOK_NPM_INTEGRITY=$(jq -r '.rook.npm_integrity' runtime.json)" \
            --build-arg "ROOK_GIT_HEAD=$(jq -r '.rook.npm_git_head' runtime.json)" \
            --build-arg "ROOK_BUILD_ENV=$(jq -r '.rook.build_environment' runtime.json)" \
            -t rook-benchmark-runtime:ci .
          docker run --rm --network none --read-only --tmpfs /tmp rook-benchmark-runtime:ci --version | diff - <(jq -r '.rook.version' runtime.json)
