name: Build and attest ROOK benchmark runtime

on:
  workflow_dispatch:
    inputs:
      expected_source_commit:
        description: Full protected main commit containing the frozen runtime inputs
        required: true
        type: string

permissions: {}

concurrency:
  group: rook-benchmark-runtime-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-attest-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: publication-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enforce protected source and resolve release identity
        id: source
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          REF_PROTECTED: ${{ github.ref_protected }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF_PROTECTED" != "true" ]] || [[ "$SOURCE_REF" != "refs/heads/main" ]]; then
            echo "release requires protected refs/heads/main" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || [[ "$EXPECTED_SOURCE_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "expected_source_commit must match the protected-ref commit" >&2
            exit 1
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          package="$(jq -er '.rook.package' runtime.json)"
          version="$(jq -er '.rook.version' runtime.json)"
          integrity="$(jq -er '.rook.npm_integrity' runtime.json)"
          git_head="$(jq -er '.rook.npm_git_head' runtime.json)"
          build_env="$(jq -er '.rook.build_environment' runtime.json)"
          test "$package" = "@testmuai/rook"
          test "$(node -p \"require('./package-lock.json').packages['node_modules/@testmuai/rook'].version\")" = "$version"
          test "$(node -p \"require('./package-lock.json').packages['node_modules/@testmuai/rook'].integrity\")" = "$integrity"
          [[ "$git_head" =~ ^[0-9a-f]{40}$ ]]
          [[ "$build_env" =~ ^(stage|prod)$ ]]
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_name="ghcr.io/${owner}/rook-benchmark-runtime/rook"
          image_tag="${image_name}:rook-${version}-source-${GITHUB_SHA:0:12}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "package=$package"
            echo "version=$version"
            echo "integrity=$integrity"
            echo "git_head=$git_head"
            echo "build_env=$build_env"
            echo "image_name=$image_name"
            echo "image_tag=$image_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build image from pinned public release
        env:
          ROOK_VERSION: ${{ steps.source.outputs.version }}
          ROOK_NPM_INTEGRITY: ${{ steps.source.outputs.integrity }}
          ROOK_GIT_HEAD: ${{ steps.source.outputs.git_head }}
          ROOK_BUILD_ENV: ${{ steps.source.outputs.build_env }}
          IMAGE_TAG: ${{ steps.source.outputs.image_tag }}
        run: |
          set -euo pipefail
          mkdir .image-release
          docker build --pull=false \
            --build-arg "ROOK_VERSION=$ROOK_VERSION" \
            --build-arg "ROOK_NPM_INTEGRITY=$ROOK_NPM_INTEGRITY" \
            --build-arg "ROOK_GIT_HEAD=$ROOK_GIT_HEAD" \
            --build-arg "ROOK_BUILD_ENV=$ROOK_BUILD_ENV" \
            -t "$IMAGE_TAG" .

      - name: Push and resolve registry digest
        id: image
        env:
          IMAGE_NAME: ${{ steps.source.outputs.image_name }}
          IMAGE_TAG: ${{ steps.source.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_TAG"
          reference="$(docker image inspect "$IMAGE_TAG" --format '{{index .RepoDigests 0}}')"
          digest="${reference#"$IMAGE_NAME"@}"
          test "$reference" = "$IMAGE_NAME@$digest"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$reference"
          {
            echo "digest=$digest"
            echo "reference=$reference"
          } >> "$GITHUB_OUTPUT"

      - name: Verify pulled image identity
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          ROOK_VERSION: ${{ steps.source.outputs.version }}
          ROOK_NPM_INTEGRITY: ${{ steps.source.outputs.integrity }}
          ROOK_GIT_HEAD: ${{ steps.source.outputs.git_head }}
          ROOK_BUILD_ENV: ${{ steps.source.outputs.build_env }}
        run: |
          set -euo pipefail
          test "$(docker image inspect "$IMAGE_REFERENCE" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$ROOK_VERSION"
          test "$(docker image inspect "$IMAGE_REFERENCE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$ROOK_GIT_HEAD"
          test "$(docker image inspect "$IMAGE_REFERENCE" --format '{{index .Config.Labels "ai.rook.benchmark.npm-integrity"}}')" = "$ROOK_NPM_INTEGRITY"
          test "$(docker image inspect "$IMAGE_REFERENCE" --format '{{index .Config.Labels "ai.rook.benchmark.environment"}}')" = "$ROOK_BUILD_ENV"
          test "$(docker run --rm --network none --read-only --tmpfs /tmp "$IMAGE_REFERENCE" --version)" = "$ROOK_VERSION"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.3
        with:
          image: ${{ steps.image.outputs.reference }}
          format: spdx-json
          output-file: .image-release/rook-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Create provenance attestation
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.source.outputs.image_name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Create SBOM attestation
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.source.outputs.image_name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: .image-release/rook-image.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify OCI attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          set -euo pipefail
          common=(--repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners --bundle-from-oci)
          gh attestation verify "oci://$IMAGE_REFERENCE" "${common[@]}"
          gh attestation verify "oci://$IMAGE_REFERENCE" "${common[@]}" --predicate-type https://spdx.dev/Document/v2.3

      - name: Assemble release evidence
        env:
          IMAGE_NAME: ${{ steps.source.outputs.image_name }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          ROOK_PACKAGE: ${{ steps.source.outputs.package }}
          ROOK_VERSION: ${{ steps.source.outputs.version }}
          ROOK_NPM_INTEGRITY: ${{ steps.source.outputs.integrity }}
          ROOK_GIT_HEAD: ${{ steps.source.outputs.git_head }}
          ROOK_BUILD_ENV: ${{ steps.source.outputs.build_env }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp -- "$PROVENANCE_BUNDLE" .image-release/provenance-attestation.json
          cp -- "$SBOM_BUNDLE" .image-release/sbom-attestation.json
          jq -n \
            --arg image_name "$IMAGE_NAME" \
            --arg image_reference "$IMAGE_REFERENCE" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg rook_package "$ROOK_PACKAGE" \
            --arg rook_version "$ROOK_VERSION" \
            --arg rook_npm_integrity "$ROOK_NPM_INTEGRITY" \
            --arg rook_git_head "$ROOK_GIT_HEAD" \
            --arg rook_build_env "$ROOK_BUILD_ENV" \
            --arg runtime_repository "$GITHUB_REPOSITORY" \
            --arg runtime_commit "$GITHUB_SHA" \
            --arg runtime_ref "$GITHUB_REF" \
            --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --arg sbom_sha256 "sha256:$(sha256sum .image-release/rook-image.spdx.json | cut -d ' ' -f 1)" \
            --arg provenance_sha256 "sha256:$(sha256sum .image-release/provenance-attestation.json | cut -d ' ' -f 1)" \
            --arg sbom_attestation_sha256 "sha256:$(sha256sum .image-release/sbom-attestation.json | cut -d ' ' -f 1)" \
            '{
              evidence_version: "1.0.0",
              image_name: $image_name,
              image_reference: $image_reference,
              image_digest: $image_digest,
              rook_release: {package: $rook_package, version: $rook_version, npm_integrity: $rook_npm_integrity, npm_git_head: $rook_git_head, build_environment: $rook_build_env},
              runtime_source: {repository: $runtime_repository, commit: $runtime_commit, ref: $runtime_ref},
              workflow_run: $workflow_run,
              sbom: {path: "rook-image.spdx.json", sha256: $sbom_sha256, predicate_type: "https://spdx.dev/Document/v2.3"},
              attestations: {
                provenance: {path: "provenance-attestation.json", sha256: $provenance_sha256},
                sbom: {path: "sbom-attestation.json", sha256: $sbom_attestation_sha256}
              },
              verification: {source: "ghcr_oci_attestations", provenance: "passed", sbom: "passed"}
            }' > .image-release/image-release-evidence.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rook-benchmark-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: .image-release
          if-no-files-found: error
          retention-days: 90

      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io || true
